---
- name: Preflight
  hosts: all
  gather_facts: true
  roles:
    - preflight

- name: Base packages
  hosts: all
  gather_facts: true
  roles:
    - base

- name: 86Box
  hosts: all
  gather_facts: true
  roles:
    - emu86box

- name: Network groups
  hosts: all
  gather_facts: true
  roles:
    - netgroups

- name: Boxes
  hosts: all
  gather_facts: true
  roles:
    - vms

- name: Consoles
  hosts: all
  gather_facts: true
  roles:
    - console

# Caddy first: it creates /etc/caddy/sites.d, which the manager unit needs at start.
- name: Caddy
  hosts: all
  gather_facts: true
  roles:
    - edge

- name: Web manager
  hosts: all
  gather_facts: true
  roles:
    - manager
