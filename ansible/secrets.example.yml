---
# Secrets. The first run of ./update.sh copies this to /opt/86server/secrets.yml (root:root, mode 600)
# with a random admin password. Edit it with: ./update.sh secrets-edit
# Secrets are only ever named secret_*, and only ever live in that file.
secret_admin_password: change-me-to-12-or-more-characters
secret_admin_password_hash: ''     # from: caddy hash-password (only until the manager login exists)
secret_cf_api_token: ''
secret_cf_account_id: ''
secret_cf_tunnel_id: ''
secret_cf_tunnel_token: ''
secret_cf_origin_cert: ''
secret_cf_origin_key: ''
secret_aop_ca_cert: ''
secret_aop_client_cert: ''
secret_aop_client_key: ''
