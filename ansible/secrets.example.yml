---
# Secrets. The first run of 86server copies this to /opt/86server/secrets.yml (root:root, mode 600) with a
# random admin password. Edit it with: 86server secrets
# Secrets are only ever named secret_*, and only ever live in that file.
# (The Cloudflare API token is not kept here: the manager keeps it, set with `86server cloudflare`.)
secret_admin_password: change-me-to-12-or-more-characters
