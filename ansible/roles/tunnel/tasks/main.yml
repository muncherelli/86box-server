---
# Cloudflare Tunnel. cloudflared (installed by the base role) runs as 86server-cloudflared when a token exists:
# - set up from the web manager's Cloudflare page (it writes /opt/86server/data/manager/cloudflared.env), or
# - from the vault (vault_cf_tunnel_token -> /opt/86server/etc/cloudflared.env) for a tunnel made by hand.
- name: Load settings for this Linux distribution
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Write the tunnel token from the vault
  ansible.builtin.copy:
    content: "TUNNEL_TOKEN={{ vault_cf_tunnel_token }}\n"
    dest: /opt/86server/etc/cloudflared.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: vault_cf_tunnel_token | default('') | length > 0
  notify: Restart cloudflared

- name: Remove the vault tunnel token when the vault has none
  ansible.builtin.file:
    path: /opt/86server/etc/cloudflared.env
    state: absent
  when: vault_cf_tunnel_token | default('') | length == 0
  notify: Restart cloudflared

- name: Install the tunnel unit
  ansible.builtin.copy:
    src: 86server-cloudflared.service
    dest: /opt/86server/system/etc/systemd/system/86server-cloudflared.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for cloudflared
    - Restart cloudflared

- name: Link the system files into /etc
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/link-system.yml"

- name: Make systemd see the unit
  ansible.builtin.meta: flush_handlers

- name: Start the tunnel at boot (it stays off until a token exists)
  ansible.builtin.systemd:
    name: 86server-cloudflared
    enabled: true
