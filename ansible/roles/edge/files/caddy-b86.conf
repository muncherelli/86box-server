# managed by 86server: do not edit
# Caddy reads its config from /opt/86server/etc/caddy and keeps its data (local CA, certificates) in /opt/86server/data/caddy.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
Environment=XDG_DATA_HOME=/opt/86server/data
Environment=XDG_CONFIG_HOME=/opt/86server/data/caddy/config
ExecStartPre=
ExecStartPre=/usr/bin/caddy validate --config /opt/86server/etc/caddy/Caddyfile
ExecStart=
ExecStart=/usr/bin/caddy run --config /opt/86server/etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /opt/86server/etc/caddy/Caddyfile --force
ReadWritePaths=/opt/86server/data/caddy
