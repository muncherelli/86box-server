---
- name: Load settings for this Linux distribution
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Check the host names Caddy will serve
  vars:
    b86_names: "{{ ([manager_host] if manager_host | default('') else []) + (lan_hosts | default([])) + (tunnel_hosts | default([])) }}"
  ansible.builtin.assert:
    that:
      - b86_names | length > 0
      - b86_names | unique | length == b86_names | length
      - b86_names | select('match', '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)*[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$') | list | length == b86_names | length
    fail_msg: >-
      Set manager_host, lan_hosts or tunnel_hosts (lowercase names, each listed once across the three).
      Got: {{ b86_names }}
    quiet: true

- name: Create Caddy's folders in /opt/86server
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    # config: the Caddyfile (Ansible), sites.d (published sites) and panel.d (control panel name), both by the manager
    - { path: /opt/86server/etc/caddy, owner: root, group: caddy, mode: "0750" }
    - { path: /opt/86server/etc/caddy/sites.d, owner: "{{ b86_user }}", group: caddy, mode: "0755" }
    - { path: /opt/86server/etc/caddy/panel.d, owner: "{{ b86_user }}", group: caddy, mode: "0755" }
    # Caddy's own data (its local CA and the certificates it manages)
    - { path: /opt/86server/data/caddy, owner: caddy, group: caddy, mode: "0700" }
    # certificates the manager gets with lego; setgid so Caddy's group can read them
    - { path: /opt/86server/data/certs, owner: "{{ b86_user }}", group: caddy, mode: "2750" }

- name: Install the snippets used to validate site files on their own
  ansible.builtin.copy:
    src: b86-validate-snippets.caddy
    dest: /opt/86server/etc/caddy/validate-snippets.caddy
    owner: root
    group: root
    mode: "0644"

- name: Create the Caddy unit drop-in folder
  ansible.builtin.file:
    path: /opt/86server/system/etc/systemd/system/caddy.service.d
    state: directory
    mode: "0755"

- name: Point Caddy at the config and data in /opt/86server
  ansible.builtin.copy:
    src: caddy-86server.conf
    dest: /opt/86server/system/etc/systemd/system/caddy.service.d/86server.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for caddy
    - Restart caddy

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/86server/etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: caddy validate --adapter caddyfile --config %s
  environment:
    XDG_DATA_HOME: /opt/86server/cache/caddy-validate
    XDG_CONFIG_HOME: /opt/86server/cache/caddy-validate
  no_log: true
  notify: Reload caddy

- name: Open the web ports in the firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]
  # Tunnel-only hosts need no inbound port: cloudflared dials out.
  when:
    - b86_ufw | default(false)
    - edge_mode != 'tunnel' or (lan_hosts | default([]) | length > 0)

- name: Link the system files into /etc
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/link-system.yml"

- name: Make systemd see the drop-in
  ansible.builtin.meta: flush_handlers

- name: Run Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
