---
# ttf-dejavu: the Qt build inside the 86Box AppImage needs at least one font.
base_packages:
  - tigervnc
  - openbox
  - caddy
  - python
  - polkit
  - openssl
  - rsync
  - nftables
  - dnsmasq
  - ttf-dejavu
  - lego          # DNS-01 certificates for the control panel name (Cloudflare page)
  - cloudflared   # Cloudflare Tunnel, started by the manager or from the vault token
