---
- name: Load settings for this Linux distribution
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install base packages
  community.general.pacman:
    name: "{{ base_packages }}"
    state: present

- name: Create the 86server folder and the home of its system files
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/86server
    - /opt/86server/system
    - /opt/86server/system/etc
    - /opt/86server/system/etc/systemd/system
    - /opt/86server/system/etc/tmpfiles.d
    - /opt/86server/system/etc/polkit-1/rules.d
    - /opt/86server/system/etc/ssh/sshd_config.d
    - /opt/86server/system/etc/sysctl.d
    - /opt/86server/system/etc/NetworkManager/conf.d

- name: Create the 86server group (shared with media_users)
  ansible.builtin.group:
    name: "{{ b86_user }}"
    gid: "{{ b86_id }}"
    system: true

- name: Create the 86server account (runs the boxes and the web manager)
  ansible.builtin.user:
    name: "{{ b86_user }}"
    uid: "{{ b86_id }}"
    group: "{{ b86_user }}"
    system: true
    shell: /usr/bin/nologin
    home: "{{ vm_data_root }}"
    create_home: false

- name: Let media users read and write the media library
  ansible.builtin.user:
    name: "{{ item }}"
    groups: ["{{ b86_user }}"]
    append: true
  loop: "{{ media_users }}"
