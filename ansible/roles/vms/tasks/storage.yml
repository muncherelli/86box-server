---
# Boxes used to be called VMs: move the old folders and drop the old units (runs once).
- name: Look for the old folders
  ansible.builtin.stat:
    path: "{{ vm_data_root }}/{{ item }}"
  loop: [vms, vmdefs]
  register: old_dirs

- name: Find running guests under the old unit name
  ansible.builtin.shell: "systemctl list-units --no-legend --state=active 'vm@*' | awk '{print $1}'"
  register: old_running
  changed_when: false

- name: Refuse to rename folders while a guest is running
  ansible.builtin.fail:
    msg: "Stop these boxes first (they run under the old unit name): {{ old_running.stdout_lines | join(', ') }}"
  when: old_running.stdout_lines | length > 0 and (old_dirs.results | selectattr('stat.exists') | list | length > 0)

- name: Stop old settings windows
  ansible.builtin.command: systemctl stop 'vm-settings@*'
  when: old_dirs.results | selectattr('stat.exists') | list | length > 0
  changed_when: true

- name: Move the old folders to their new names
  ansible.builtin.command: "mv {{ vm_data_root }}/{{ item.item }} {{ vm_data_root }}/{{ {'vms': 'boxes', 'vmdefs': 'boxdefs'}[item.item] }}"
  args:
    creates: "{{ vm_data_root }}/{{ {'vms': 'boxes', 'vmdefs': 'boxdefs'}[item.item] }}"
  loop: "{{ old_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Find box configs that still mention the old folder
  ansible.builtin.find:
    paths: "{{ vm_data_root }}/boxes"
    patterns: 86box.cfg
    recurse: true
    depth: 2
  register: box_cfgs

- name: Point those configs at the new folder
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: "{{ vm_data_root | regex_escape }}/vms/"
    replace: "{{ vm_data_root }}/boxes/"
  loop: "{{ box_cfgs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Move the media library from data/media to /opt/86server/media (older layout, runs once)
  ansible.builtin.shell: |
    set -eu
    old="{{ vm_data_root }}/media"
    [ -d "$old" ] || exit 0
    for pair in isos:iso floppies:floppy disks:disk; do
      from="$old/${pair%%:*}"; to="{{ media_root }}/${pair##*:}"
      [ -d "$from" ] || continue
      mkdir -p "$to"
      find "$from" -mindepth 1 -maxdepth 1 -exec mv -n -t "$to" {} +
      rmdir "$from" 2>/dev/null || true
    done
    rmdir "$old" 2>/dev/null || true
    echo moved
  args:
    executable: /bin/bash
  register: b86_media_move
  changed_when: "'moved' in b86_media_move.stdout"

- name: Find box configs that may point at the old media folders
  ansible.builtin.find:
    paths: "{{ vm_data_root }}/boxes"
    patterns: 86box.cfg
    recurse: true
    depth: 2
  register: b86_media_cfgs

- name: Point those configs at the new media folders
  ansible.builtin.replace:
    path: "{{ item.0.path }}"
    regexp: "{{ item.1.from }}"
    replace: "{{ item.1.to }}"
  loop: "{{ b86_media_cfgs.files | product([
      {'from': '(' ~ (vm_data_root | regex_escape) ~ '|\\.\\./\\.\\.)/media/isos/', 'to': media_root ~ '/iso/'},
      {'from': '(' ~ (vm_data_root | regex_escape) ~ '|\\.\\./\\.\\.)/media/floppies/', 'to': media_root ~ '/floppy/'},
      {'from': '(' ~ (vm_data_root | regex_escape) ~ '|\\.\\./\\.\\.)/media/disks/', 'to': media_root ~ '/disk/'}]) | list }}"
  loop_control:
    label: "{{ item.0.path }} {{ item.1.to }}"

- name: Create the data folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vm_data_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ vm_data_root }}/boxdefs", owner: "{{ mgr_user }}", group: "{{ mgr_user }}", mode: "0755" }
    - { path: "{{ vm_data_root }}/boxes", owner: "{{ mgr_user }}", group: "{{ vm_share_group }}", mode: "0755" }
    - { path: "{{ media_root }}", owner: "{{ mgr_user }}", group: "{{ vm_share_group }}", mode: "2775" }
    - { path: "{{ vm_data_root }}/manager", owner: "{{ mgr_user }}", group: "{{ mgr_user }}", mode: "0700" }
    - { path: "{{ vm_data_root }}/vnc-tokens", owner: "{{ mgr_user }}", group: "{{ mgr_user }}", mode: "0700" }
    - { path: "{{ vm_data_root }}/trash", owner: "{{ mgr_user }}", group: "{{ mgr_user }}", mode: "0700" }
    - { path: /opt/86server/etc, owner: root, group: "{{ mgr_user }}", mode: "0751" }
    - { path: /opt/86server/cache, owner: root, group: root, mode: "0755" }
    - { path: /opt/86server/cache/box, owner: "{{ vm_service_user }}", group: "{{ vm_service_user }}", mode: "0700" }
    - { path: /opt/86server, owner: root, group: root, mode: "0755" }
    - { path: /opt/86server/libexec, owner: root, group: root, mode: "0755" }

- name: Create the media library folders, one per kind of 86Box drive
  ansible.builtin.file:
    path: "{{ media_root }}/{{ item }}"
    state: directory
    owner: "{{ mgr_user }}"
    group: "{{ vm_share_group }}"
    mode: "2775"
  loop: "{{ media_kinds }}"
