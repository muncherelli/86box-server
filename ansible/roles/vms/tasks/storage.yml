---
- name: Create the data folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vm_data_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ vm_data_root }}/boxdefs", owner: "{{ b86_user }}", group: "{{ b86_user }}", mode: "0755" }
    - { path: "{{ vm_data_root }}/boxes", owner: "{{ b86_user }}", group: "{{ b86_user }}", mode: "0755" }
    - { path: "{{ media_root }}", owner: "{{ b86_user }}", group: "{{ b86_user }}", mode: "2775" }
    - { path: "{{ vm_data_root }}/manager", owner: "{{ b86_user }}", group: "{{ b86_user }}", mode: "0700" }
    - { path: "{{ vm_data_root }}/vnc-tokens", owner: "{{ b86_user }}", group: "{{ b86_user }}", mode: "0700" }
    - { path: "{{ vm_data_root }}/trash", owner: "{{ b86_user }}", group: "{{ b86_user }}", mode: "0700" }
    - { path: /opt/86server/etc, owner: root, group: "{{ b86_user }}", mode: "0751" }
    - { path: /opt/86server/cache, owner: root, group: root, mode: "0755" }
    - { path: /opt/86server/cache/box, owner: "{{ b86_user }}", group: "{{ b86_user }}", mode: "0700" }
    - { path: /opt/86server, owner: root, group: root, mode: "0755" }
    - { path: /opt/86server/libexec, owner: root, group: root, mode: "0755" }

- name: Create the media library folders, one per kind of 86Box drive
  ansible.builtin.file:
    path: "{{ media_root }}/{{ item }}"
    state: directory
    owner: "{{ b86_user }}"
    group: "{{ b86_user }}"
    mode: "2775"
  loop: "{{ media_kinds }}"
