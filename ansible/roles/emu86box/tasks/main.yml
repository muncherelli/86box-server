---
- name: Load settings for this Linux distribution
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Create the 86Box folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/86server/cache
    - /opt/86server/vendor/86box
    - /opt/86server/vendor/roms

# Older inventories pin a single x86_64 build (url and sha256 directly under emu86box).
- name: Pick the 86Box build for this CPU architecture
  ansible.builtin.set_fact:
    emu86box_build: >-
      {{ pins.emu86box.builds[ansible_facts['architecture']]
         if pins.emu86box.builds is defined
         else (pins.emu86box if ansible_facts['architecture'] == 'x86_64' else none) }}

- name: Stop if no 86Box build is pinned for this architecture
  ansible.builtin.assert:
    that: emu86box_build is mapping
    fail_msg: >-
      No 86Box build is pinned for {{ ansible_facts['architecture'] }}. Add one under pins.emu86box.builds in
      /opt/86server/inventory/group_vars/all/pins.yml (see the example in the repo).
    quiet: true

- name: Download the 86Box AppImage
  ansible.builtin.get_url:
    url: "{{ emu86box_build.url }}"
    dest: "/opt/86server/cache/86Box-{{ pins.emu86box.tag }}-{{ ansible_facts['architecture'] }}.AppImage"
    checksum: "sha256:{{ emu86box_build.sha256 }}"
    mode: "0755"

- name: Check whether this 86Box version is already extracted
  ansible.builtin.stat:
    path: "/opt/86server/vendor/86box/{{ pins.emu86box.tag }}/AppRun"
  register: have_86box

- name: Extract the AppImage
  when: not have_86box.stat.exists
  block:
    - name: Start with an empty scratch folder
      ansible.builtin.file:
        path: /opt/86server/vendor/86box/extract-tmp
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]

    - name: Extract (no FUSE needed)
      ansible.builtin.command:
        cmd: "/opt/86server/cache/86Box-{{ pins.emu86box.tag }}-{{ ansible_facts['architecture'] }}.AppImage --appimage-extract"
        chdir: /opt/86server/vendor/86box/extract-tmp
      changed_when: true

    - name: Move the extracted tree into its versioned folder
      ansible.builtin.command: "mv /opt/86server/vendor/86box/extract-tmp/squashfs-root /opt/86server/vendor/86box/{{ pins.emu86box.tag }}"
      changed_when: true

    - name: Make it readable by everyone, writable by root only
      ansible.builtin.command: "chmod -R u=rwX,go=rX /opt/86server/vendor/86box/{{ pins.emu86box.tag }}"
      changed_when: true

    - name: Remove the scratch folder
      ansible.builtin.file:
        path: /opt/86server/vendor/86box/extract-tmp
        state: absent

- name: Point 'current' at this 86Box version
  ansible.builtin.file:
    src: "{{ pins.emu86box.tag }}"
    dest: /opt/86server/vendor/86box/current
    state: link
    force: true

- name: Download the ROM set
  ansible.builtin.get_url:
    url: "{{ pins.roms.url }}"
    dest: "/opt/86server/cache/roms-{{ pins.roms.tag }}.tar.gz"
    checksum: "sha256:{{ pins.roms.sha256 }}"
    mode: "0644"

- name: Create the ROM folder for this version
  ansible.builtin.file:
    path: "/opt/86server/vendor/roms/{{ pins.roms.tag }}"
    state: directory
    mode: "0755"

- name: Unpack the ROM set
  ansible.builtin.unarchive:
    src: "/opt/86server/cache/roms-{{ pins.roms.tag }}.tar.gz"
    dest: "/opt/86server/vendor/roms/{{ pins.roms.tag }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: "/opt/86server/vendor/roms/{{ pins.roms.tag }}/machines"

- name: Point 'current' at this ROM set
  ansible.builtin.file:
    src: "{{ pins.roms.tag }}"
    dest: /opt/86server/vendor/roms/current
    state: link
    force: true
