---
# One bridge per network group. The host's uplink is never added to a bridge.

- name: Tell NetworkManager to leave the bridges and tap devices alone
  ansible.builtin.template:
    src: 86box-nm.conf.j2
    dest: /etc/NetworkManager/conf.d/86box.conf
    owner: root
    group: root
    mode: "0644"
  when: b86_nm | bool
  notify: Reload NetworkManager

- name: Apply the NetworkManager setting before the bridges exist
  ansible.builtin.meta: flush_handlers

- name: Create the libexec folder
  ansible.builtin.file:
    path: /opt/86box-server/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the bridge script
  ansible.builtin.copy:
    src: bridges
    dest: /opt/86box-server/libexec/bridges
    owner: root
    group: root
    mode: "0755"
  register: b86_bridge_script

- name: Install the bridge unit
  ansible.builtin.copy:
    src: 86box-bridges.service
    dest: /etc/systemd/system/86box-bridges.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for the network groups

- name: Make systemd see the bridge unit
  ansible.builtin.meta: flush_handlers

- name: Run the bridges
  ansible.builtin.systemd:
    name: 86box-bridges
    enabled: true
    state: started
  register: b86_bridges_started

- name: Run the bridge script again when the groups or the script changed
  ansible.builtin.systemd:
    name: 86box-bridges
    state: restarted
  when:
    - not b86_bridges_started.changed
    - b86_groups_json.changed or b86_bridge_script.changed
