---
# Network groups. The work is done by one root helper, netgroups-apply, which both this role (first time
# only) and the web manager (every later change) use. After the first run the groups live in
# /opt/86server/etc/netgroups.json and netpolicy.json and are managed in the web manager: the
# netgroups, group_routes and nat_dns settings in the inventory are only the starting point.

- name: Load settings for this Linux distribution
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Create the config folder
  ansible.builtin.file:
    path: /opt/86server/etc
    state: directory
    owner: root
    group: "{{ b86_user }}"
    mode: "0751"

- name: Create the libexec folder
  ansible.builtin.file:
    path: /opt/86server/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the network group helper
  ansible.builtin.copy:
    src: "{{ item.name }}"
    dest: "/opt/86server/libexec/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { name: netgroups-apply, mode: "0755" }
    - { name: netgroups_core.py, mode: "0644" }

- name: Install the fixed units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/86server/system/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [86server-bridges.service, 86server-nft.service, 86server-dnsmasq.service]
  notify: Reload systemd for the network groups

- name: Install the units that watch for requests from the web manager
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/opt/86server/system/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [86server-netapply.service, 86server-netapply.path]
  notify: Reload systemd for the network groups

- name: Link the system files into /etc
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/link-system.yml"

- name: Make systemd see the units
  ansible.builtin.meta: flush_handlers

- name: Look for the saved network group settings
  ansible.builtin.stat:
    path: /opt/86server/etc/netpolicy.json
  register: b86_netpolicy

- name: Set up the network groups from the inventory (first run only)
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /opt/86server/libexec/netgroups-apply
      - --seed
      - "-"
      - --data-root
      - "{{ vm_data_root }}"
      - --mgr-group
      - "{{ b86_user }}"
    stdin: >-
      {{ {'netgroups': netgroups, 'group_routes': group_routes | default([]),
          'nat_dns': nat_dns | default(['1.1.1.1'])} | to_json }}
  register: b86_netseed
  changed_when: "'applied' in b86_netseed.stdout"
  when: not b86_netpolicy.stat.exists

- name: Bring the bridges back at boot
  ansible.builtin.systemd:
    name: 86server-bridges
    enabled: true

- name: Watch for network group requests from the web manager
  ansible.builtin.systemd:
    name: 86server-netapply.path
    enabled: true
    state: started
