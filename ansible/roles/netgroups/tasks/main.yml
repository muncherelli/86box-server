---
- name: Load settings for this Linux distribution
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Create the config folder
  ansible.builtin.file:
    path: /etc/86box-server
    state: directory
    owner: root
    group: "{{ mgr_user }}"
    mode: "0750"

- name: Write the network group list (read by the config guard and the manager)
  ansible.builtin.copy:
    content: "{{ netgroups | to_nice_json }}\n"
    dest: /etc/86box-server/netgroups.json
    owner: root
    group: "{{ mgr_user }}"
    mode: "0640"
  register: b86_groups_json

- name: Set up the bridges
  ansible.builtin.import_tasks: bridges.yml
  when: netgroups | length > 0

- name: Set up the firewall table for the bridges
  ansible.builtin.import_tasks: nftables.yml
  when: netgroups | length > 0

- name: Set up forwarding for internet access and group routes
  ansible.builtin.import_tasks: forwarding.yml

- name: Set up DHCP for the groups that want it
  ansible.builtin.import_tasks: dhcp.yml
  when: netgroups | length > 0
