---
# Optional DHCP for guests, one dnsmasq for all groups that have dhcp: true.
# DHCP only (port=0): no DNS server. Arch's own dnsmasq.service is never used
# (preflight refuses to run while it is active).

- name: Work out which groups want DHCP
  ansible.builtin.set_fact:
    b86_dhcp_names: >-
      {{ netgroups | dict2items | selectattr('value.dhcp', 'defined')
         | selectattr('value.dhcp') | map(attribute='key') | list }}

- name: Set up DHCP
  when: b86_dhcp_names | length > 0
  block:
    - name: Write the DHCP settings
      ansible.builtin.template:
        src: dnsmasq.conf.j2
        dest: /etc/86box-server/dnsmasq.conf
        owner: root
        group: root
        mode: "0644"
        trim_blocks: true
        lstrip_blocks: true
        validate: dnsmasq --test --conf-file=%s
      notify: Restart dnsmasq for guests

    - name: Install the DHCP unit
      ansible.builtin.copy:
        src: 86box-dnsmasq.service
        dest: /etc/systemd/system/86box-dnsmasq.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd for the network groups

    - name: Make systemd see the DHCP unit
      ansible.builtin.meta: flush_handlers

    - name: Run DHCP now and at boot
      ansible.builtin.systemd:
        name: 86box-dnsmasq
        enabled: true
        state: started

    - name: Let guests reach DHCP through ufw
      community.general.ufw:
        rule: allow
        direction: in
        interface: "{{ netgroups[item].bridge }}"
        proto: udp
        port: "67"
      loop: "{{ b86_dhcp_names }}"
      when: b86_ufw | default(false)

- name: Turn DHCP off when no group wants it
  when: b86_dhcp_names | length == 0
  block:
    - name: Look for the DHCP unit
      ansible.builtin.stat:
        path: /etc/systemd/system/86box-dnsmasq.service
      register: b86_dnsmasq_unit

    - name: Stop DHCP
      ansible.builtin.systemd:
        name: 86box-dnsmasq
        enabled: false
        state: stopped
      when: b86_dnsmasq_unit.stat.exists

    - name: Remove the DHCP unit and settings
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/86box-dnsmasq.service
        - /etc/86box-server/dnsmasq.conf
      notify: Reload systemd for the network groups

- name: Close the DHCP port for groups without DHCP
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ item.value.bridge }}"
    proto: udp
    port: "67"
    delete: true
  loop: "{{ netgroups | dict2items | rejectattr('key', 'in', b86_dhcp_names) | list }}"
  loop_control:
    label: "{{ item.key }}"
  when: b86_ufw | default(false)
