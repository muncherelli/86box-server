---
- name: Reload systemd for the network groups
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart dnsmasq for guests
  ansible.builtin.systemd:
    name: 86server-dnsmasq
    state: restarted

- name: Reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
