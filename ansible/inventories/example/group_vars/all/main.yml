---
# Settings for this host. The first `86server` run copies this folder to /opt/86server/inventory. Change that
# copy (86server settings), never this example. Fixed parts of the layout (the 86server account, uid/gid 86,
# the folders) are in ansible/group_vars/all/defaults.yml.

media_users: []                   # login users who may read/write the media library (they join group 86server)
sftp_only_users: []               # [{name: x, ssh_key: 'ssh-ed25519 ...'}], SFTP-only accounts

# Web front (Caddy). See docs/edge.md.
# Real names, Let's Encrypt certificates and the Cloudflare Tunnel are set up with `86server cloudflare` (or the
# web manager's Cloudflare page), not here.
lan_hosts: ["{{ ansible_facts['hostname'] }}"]
                                  # LAN names for the manager: plain http with no redirect AND https with Caddy's
                                  # local CA (self-signed). The default is this machine's own name; add others
                                  # (e.g. box.lan) and point them at this host in your LAN DNS.
publish_domains: []               # LAN-only domains sites may be published under (Caddy's local CA). Sites in a
                                  # Cloudflare zone need nothing here.

# Network groups: ONLY THE STARTING POINT. `86server update` reads these settings the first time it runs on a
# host. After that the groups live on the host and are managed in the web manager (Network groups page);
# changing these lines later does nothing. Private ranges only (10.x, 172.16-31.x, 192.168.x), /16 to /29.
netgroups: {}                     # example: lab: {cidr: 10.86.0.0/24, egress: none, dhcp: false}
group_routes: []                  # example: [[lab, web]]
nat_dns: ['1.1.1.1']              # DNS handed to guests in nat groups
port_forward_limits: []           # see the port-forward row on the sheet

# Pinned versions live in the sibling file pins.yml; secrets in /opt/86server/secrets.yml (86server secrets).
# When a later row needs a new variable, add it here.
